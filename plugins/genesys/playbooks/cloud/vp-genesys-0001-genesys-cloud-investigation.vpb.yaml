playbook:
  api_version: voicepilot.io/v1
  kind: Playbook

  metadata:
    id: VP-GENESYS-0001
    version: "1.0.0"
    title: Genesys Cloud Investigation
    description: >
      TAC-grade deterministic investigation for Genesys Cloud CX using uploaded export
      evidence only. Read-only — never connects via OAuth, REST, GraphQL, or performs
      configuration changes.
    category: cloud
    vendor: genesys
    status: active
    author: voicepilot-curator
    reviewed_by: tac-sme
    effective_from: 2026-06-19
    tags: [genesys, cloud, oauth, edge, byoc, queue, architect, media]

  platforms:
    - vendor: genesys
      products: [cloud]
      min_version: "1.0"
      roles: [contact_center]

  intake:
    questions:
      - id: Q-GC-001
        text: Did Genesys Cloud contact center ever work?
        category: intake
        phase: INTAKE
        target_field: known_facts.worked_previously
        required: true
      - id: Q-GC-002
        text: When did the issue start?
        category: intake
        phase: INTAKE
        target_field: timeline.onset
        required: true
      - id: Q-GC-003
        text: Describe the symptom.
        category: scope
        phase: INTAKE
        target_field: known_facts.symptom_detail
        required: true
      - id: Q-GC-004
        text: Which queues, agents, or trunks are affected?
        category: scope
        phase: INTAKE
        target_field: affected_scope.destination_classes
        required: true
      - id: Q-GC-005
        text: What PSTN/BYOC connectivity model is in use?
        category: topology
        phase: INTAKE
        target_field: known_facts.pstn_connectivity
        required: true
      - id: Q-GC-006
        text: Has any Genesys Cloud configuration changed recently?
        category: change
        phase: DISCOVERY
        target_field: known_facts.recent_changes
        required: false

  evidence:
    requirements:
      - id: EVD-GC-001
        title: organization-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-002
        title: users-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-003
        title: queues-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-004
        title: queue-members-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-005
        title: agents-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-006
        title: presence-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-007
        title: flows-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-008
        title: architect-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-009
        title: data-actions-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-010
        title: byoc-cloud-trunks-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-011
        title: byoc-premises-trunks-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-012
        title: edge-devices-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-013
        title: recording-policies-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-014
        title: campaigns-export
        type: export
        mandatory: true
        phase: COLLECTION
      - id: EVD-GC-015
        title: skills-export
        type: export
        mandatory: true
        phase: COLLECTION
    commands:
      - id: CMD-GC-001
        command: organization-export
        cost: low
        privilege: read
      - id: CMD-GC-002
