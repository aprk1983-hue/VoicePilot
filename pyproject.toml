[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voicepilot"
version = "0.1.0"
description = "VoicePilot Core Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
]

[project.scripts]
voicepilot = "cli.voicepilot_cli:main"

[tool.pytest.ini_options]
pythonpath = ["core", "sdk", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = [".", "core"]
include = [
    "cli*",
    "api*",
    "sdk*",
    "plugins*",
    "domain*",
    "runtime*",
    "application*",
    "infrastructure*",
    "shared*",
    "parser*",
    "model*",
    "topology*",
    "health*",
    "knowledge*",
    "configuration*",
    "discovery*",
    "investigation_quality*",
    "investigation*",
    "brain",
    "services*",
    "engineering_assets*",
    "engineering_knowledge*",
    "change_package*",
    "reporting*",
    "investigation_compare*",
    "asset_factory*",
    "validation*",
    "vendor_sdk*",
]
exclude = [
    "knowledge.packs*",
    "knowledge.incidents*",
    "knowledge.runbooks*",
    "knowledge.verification*",
    "knowledge.references*",
    "brain.*",
]
