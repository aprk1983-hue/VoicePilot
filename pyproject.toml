[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voicepilot"
version = "0.1.0"
description = "VoicePilot Core Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
pythonpath = ["core", "sdk"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["core", "."]
include = ["domain*", "runtime*", "application*", "infrastructure*", "shared*", "sdk*"]
