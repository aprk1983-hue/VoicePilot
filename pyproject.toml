[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voicepilot"
version = "0.1.0"
description = "VoicePilot Core Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
voicepilot = "cli.voicepilot_cli:main"

[tool.pytest.ini_options]
pythonpath = ["core", "sdk", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["core", "cli", "sdk"]
include = [
    "domain*",
    "runtime*",
    "application*",
    "infrastructure*",
    "shared*",
    "sdk*",
    "cli*",
    "parser*",
    "model*",
    "topology*",
    "health*",
    "knowledge*",
]
exclude = ["knowledge.packs*"]
